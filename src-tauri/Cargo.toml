[package]
name = "worktime-pomodoro"
version = "0.1.0"
description = "工時番茄鐘桌面工具"
authors = ["你"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[lib]
name = "worktime_pomodoro_lib"
crate-type = ["rlib"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

tokio = { version = "1.35", features = ["rt-multi-thread", "time", "sync", "macros"] }
rusqlite = { version = "0.30", features = ["bundled"] }
rusqlite_migration = "1.0"
chrono = { version = "0.4.26", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.8"
