name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.get_version.outputs.VERSION }}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')"
            if [ "$draft" != "true" ]; then
              echo "Release ${GITHUB_REF_NAME} is already public and will not be changed."
            else
              echo "Reusing draft ${GITHUB_REF_NAME}"
            fi
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "Release ${version}" \
              --notes "Release ${version}"
          fi

  build-tauri:
    name: Build Tauri App
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
          - platform: macos-latest
            rust_target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Install Just
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
          # Install system dependencies
          just install-system-deps

      - name: Install dependencies
        run: npm ci

      - name: Install Just (non-Linux)
        if: matrix.platform != 'ubuntu-22.04'
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            brew install just
          elif [ "$RUNNER_OS" == "Windows" ]; then
            choco install just
          fi
        shell: bash

      - name: Build frontend
        run: just build-frontend

      - name: Build Tauri
        run: npm run tauri:build -- --target ${{ matrix.rust_target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "Refusing to overwrite assets on published release ${GITHUB_REF_NAME}."
            exit 1
          fi
          bundle="src-tauri/target/${RUST_TARGET}/release/bundle"
          # macOS runners ship Bash 3.2, which has no mapfile.
          list_bundles() {
            find "$bundle" -type f \
              \( -name '*.AppImage' -o -name '*.AppImage.sig' \
                 -o -name '*.AppImage.tar.gz' -o -name '*.AppImage.tar.gz.sig' \
                 -o -name '*.deb' -o -name '*.rpm' \
                 -o -name '*.dmg' -o -name '*.dmg.sig' \
                 -o -name '*.exe' -o -name '*.exe.sig' -o -name '*-setup.exe.zip' -o -name '*-setup.exe.zip.sig' \
                 -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) \
              -print0
          }
          found=0
          sigs=0
          while IFS= read -r -d '' f; do
            found=1
            case "$f" in
              *.sig) sigs=$((sigs + 1)) ;;
            esac
          done < <(list_bundles)
          if [ "$found" -eq 0 ]; then
            echo "No installers found under $bundle"
            find "$bundle" -type f | head -100 || true
            exit 1
          fi
          if [ "$sigs" -eq 0 ]; then
            echo "Tauri did not sign the bundles. TAURI_SIGNING_PRIVATE_KEY is missing."
            exit 1
          fi
          stage=$(mktemp -d)
          dest_name() {
            local base="$1"
            if [[ "$base" == *.sig ]]; then
              local inner
              inner=$(dest_name "${base%.sig}")
              printf '%s.sig' "$inner"
              return
            fi
            case "$base" in
              *aarch64*|*amd64*|*x86_64*|*x64*) printf '%s' "$base" ;;
              *) printf '%s-%s' "$RUST_TARGET" "$base" ;;
            esac
          }
          while IFS= read -r -d '' f; do
            name=$(dest_name "$(basename "$f")")
            cp "$f" "$stage/$name"
            echo "Uploading $name"
            gh release upload "${GITHUB_REF_NAME}" "$stage/$name" --clobber
          done < <(list_bundles)

  publish:
    name: Publish release
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require every platform installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "Release ${GITHUB_REF_NAME} is no longer a draft."
            exit 1
          fi
          for asset in \
            "worktime-pomodoro_${version}_amd64.AppImage" \
            "worktime-pomodoro_${version}_amd64.deb" \
            "worktime-pomodoro-${version}-1.x86_64.rpm" \
            "worktime-pomodoro_${version}_x64-setup.exe" \
            "worktime-pomodoro_${version}_aarch64.dmg" \
            "worktime-pomodoro_${version}_x64.dmg"
          do
            if ! gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              echo "Draft ${GITHUB_REF_NAME} is missing ${asset}"
              exit 1
            fi
          done

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/write-latest-json.py

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" latest.json --clobber

      - name: Publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Signatures are already inside latest.json. Drop the separate .sig
          # files so the release page only offers installers.
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' \
            | while IFS= read -r name; do
                case "$name" in
                  *.sig) gh release delete-asset "${GITHUB_REF_NAME}" "$name" --yes ;;
                esac
              done
          workdir="$(mktemp -d)"
          sums="$workdir.SHA256SUMS"
          installers=(
            "worktime-pomodoro_${version}_amd64.AppImage"
            "worktime-pomodoro_${version}_amd64.deb"
            "worktime-pomodoro-${version}-1.x86_64.rpm"
            "worktime-pomodoro_${version}_x64-setup.exe"
            "worktime-pomodoro_${version}_aarch64.dmg"
            "worktime-pomodoro_${version}_x64.dmg"
          )
          gh release download "${GITHUB_REF_NAME}" --dir "$workdir" "${installers[@]}"
          : > "$sums"
          for name in "${installers[@]}"; do
            ( cd "$workdir" && sha256sum "$name" ) >> "$sums"
          done
          if grep -q ' SHA256SUMS$' "$sums"; then
            echo "SHA256SUMS listed itself."
            exit 1
          fi
          cat "$sums"
          cp "$sums" "$workdir/SHA256SUMS"
          gh release upload "${GITHUB_REF_NAME}" "$workdir/SHA256SUMS" --clobber
          prev="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          notes="$workdir.notes.md"
          {
            echo "## What's Changed"
            echo
            if [ -n "$prev" ]; then
              git log --pretty='* %s' "${prev}..HEAD" | grep -v '^\* release: publish ' || true
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            fi
            echo
            echo "<!-- sha256sums -->"
            echo
            echo "### SHA-256 checksums"
            echo
            echo '```'
            cat "$sums"
            echo '```'
          } > "$notes"
          gh release edit "${GITHUB_REF_NAME}" --notes-file "$notes"

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
