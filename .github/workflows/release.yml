name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.get_version.outputs.VERSION }}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Release ${version}" \
              --notes "Release ${version}"
          fi

  build-tauri:
    name: Build Tauri App
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
          - platform: macos-latest
            rust_target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Install Just
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
          # Install system dependencies
          just install-system-deps

      - name: Install dependencies
        run: npm ci

      - name: Install Just (non-Linux)
        if: matrix.platform != 'ubuntu-22.04'
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            brew install just
          elif [ "$RUNNER_OS" == "Windows" ]; then
            choco install just
          fi
        shell: bash

      - name: Build frontend
        run: just build-frontend

      - name: Build Tauri
        run: npm run tauri:build -- --target ${{ matrix.rust_target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/${RUST_TARGET}/release/bundle"
          mapfile -t files < <(find "$bundle" -type f \
            \( -name '*.AppImage' -o -name '*.AppImage.sig' \
               -o -name '*.AppImage.tar.gz' -o -name '*.AppImage.tar.gz.sig' \
               -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.dmg' -o -name '*.dmg.sig' \
               -o -name '*.msi' -o -name '*.msi.sig' -o -name '*.msi.zip' -o -name '*.msi.zip.sig' \
               -o -name '*.exe' -o -name '*.exe.sig' -o -name '*-setup.exe.zip' -o -name '*-setup.exe.zip.sig' \
               -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \))
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers found under $bundle"
            find "$bundle" -type f | head -100
            exit 1
          fi
          sigs=0
          for f in "${files[@]}"; do
            case "$f" in
              *.sig) sigs=$((sigs + 1)) ;;
            esac
          done
          if [ "$sigs" -eq 0 ]; then
            echo "Tauri did not sign the bundles. TAURI_SIGNING_PRIVATE_KEY is missing."
            exit 1
          fi
          stage=$(mktemp -d)
          dest_name() {
            local base="$1"
            if [[ "$base" == *.sig ]]; then
              local inner
              inner=$(dest_name "${base%.sig}")
              printf '%s.sig' "$inner"
              return
            fi
            case "$base" in
              *aarch64*|*amd64*|*x86_64*|*x64*) printf '%s' "$base" ;;
              *) printf '%s-%s' "$RUST_TARGET" "$base" ;;
            esac
          }
          for f in "${files[@]}"; do
            name=$(dest_name "$(basename "$f")")
            cp "$f" "$stage/$name"
            echo "Uploading $name"
            gh release upload "${GITHUB_REF_NAME}" "$stage/$name" --clobber
          done

  generate-update-manifest:
    name: Generate Update Manifest
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/write-latest-json.py

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" latest.json --clobber
